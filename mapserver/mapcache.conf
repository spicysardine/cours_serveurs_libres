# mettre dans conf-available

<IfModule mapcache_module>
    # Directory containing the mapcache.xml (must be readable by www-data)
    <Directory /etc/mapcache>
        Require all granted
    </Directory>

    # Optional: protect the cache directory (write access only needed by www-data)
    <Directory /var/cache/mapcache>
        Require all granted
    </Directory>

    # This is the key directive: maps /mapcache/* to your configuration file
    MapCacheAlias /mapcache "/etc/mapcache/mapcache.xml"
</IfModule>
